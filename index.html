<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jellico Hardware Store</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
  }

  header {
    background: #2f5d3a;
    color: white;
    padding: 20px;
    text-align: center;
  }

  .container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
  }

  h2 {
    margin-top: 40px;
  }

  .products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  .product {
    background: white;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
  }

  .product button {
    background: #2f5d3a;
    color: white;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 5px;
  }

  .cart {
    background: white;
    padding: 20px;
    border-radius: 8px;
    margin-top: 40px;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: #666;
  }
</style>
</head>

<body>

<header>
  <h1>Jellico Hardware</h1>
  <p>Your Local Online Hardware Store</p>
</header>

<div class="container">

  <h2>Lumber</h2>
  <div class="products">
    <div class="product">
      <h3>2x4 Lumber</h3>
      <p>$4.99</p>
      <button onclick="addToCart('2x4 Lumber', 4.99)">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Plywood Sheet</h3>
      <p>$29.99</p>
      <button onclick="addToCart('Plywood Sheet', 29.99)">Add to Cart</button>
    </div>
  </div>

  <h2>Tools</h2>
  <div class="products">
    <div class="product">
      <h3>Hammer</h3>
      <p>$12.99</p>
      <button onclick="addToCart('Hammer', 12.99)">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Cordless Drill</h3>
      <p>$79.99</p>
      <button onclick="addToCart('Cordless Drill', 79.99)">Add to Cart</button>
    </div>
  </div>

  <h2>Fasteners</h2>
  <div class="products">
    <div class="product">
      <h3>Box of Screws</h3>
      <p>$6.99</p>
      <button onclick="addToCart('Box of Screws', 6.99)">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Box of Nails</h3>
      <p>$5.99</p>
      <button onclick="addToCart('Box of Nails', 5.99)">Add to Cart</button>
    </div>
  </div>

  <div class="cart">
    <h2>Shopping Cart</h2>
    <ul id="cart-items"></ul>
    <h3>Total: $<span id="total">0.00</span></h3>
  </div>

</div>

<footer>
  © Jellico Hardware
</footer>

<script>
  let total = 0;

  function addToCart(item, price) {
    const list = document.getElementById('cart-items');
    const li = document.createElement('li');
    li.textContent = `${item} - $${price.toFixed(2)}`;
    list.appendChild(li);

    total += price;
    document.getElementById('total').textContent = total.toFixed(2);
  }
</script>

</body>
</html>
